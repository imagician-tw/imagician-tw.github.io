baseURL = 'https://imagician.tw/'
locale = 'zh-TW'
defaultContentLanguage = 'zh-tw'
title = 'imagician 創想符碼'
theme = 'PaperMod'
hasCJKLanguage = true
enableRobotsTXT = true

[pagination]
pagerSize = 10

[taxonomies]
tag = 'tags'

[outputs]
home = ['HTML', 'RSS', 'JSON']

[params]
env = 'production'
description = '創想符碼 imagician：程式與 AI 教育。從理解原理開始，讓想像成為你能施展的魔法'
keywords = ['imagician', '創想符碼', '程式教育', 'AI 教育', 'CLI']
images = ['images/og-image.png']
defaultTheme = 'auto'
mainSections = ['posts']
DateFormat = '2006-01-02'

ShowReadingTime = true
ShowPostNavLinks = true
ShowBreadCrumbs = true
ShowCodeCopyButtons = true
ShowShareButtons = true
ShareButtons = ['facebook', 'x', 'linkedin']

[params.label]
text = 'imagician.tw'

[params.assets]
favicon = 'favicon.svg'
theme_color = '#fbfbf9'
msapplication_TileColor = '#fbfbf9'

[params.fuseOpts]
keys = ['title', 'permalink', 'summary', 'content']

[[menus.main]]
name = '文章'
pageRef = '/posts'
weight = 10

[[menus.main]]
name = '社群'
pageRef = '/community'
weight = 20

[[menus.main]]
name = '標籤'
pageRef = '/tags'
weight = 30

[[menus.main]]
name = '搜尋'
pageRef = '/search'
weight = 40

[markup.highlight]
style = 'algol'
